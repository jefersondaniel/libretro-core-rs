[workspace]
resolver = "3"
members = [
    "crates/*",
    # Keep these explicit: Release Please expands globs without honoring exclude.
    "examples/demo-libretro",
    "examples/glow-libretro",
    "examples/hello-libretro",
    "examples/retrocompat-libretro",
    "examples/software-libretro",
]

[profile.release]
codegen-units = 1
lto = "thin"

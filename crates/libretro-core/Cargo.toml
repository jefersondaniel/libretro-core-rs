[package]
name = "libretro-core"
version = "1.0.0"
edition = "2024"
description = "Minimal Rust wrapper and core-export abstraction for libretro.h"
repository = "https://github.com/jefersondaniel/libretro-core-rs"
readme = "../../README.md"
license = "MIT"

[dependencies]
enumflags2 = "0.7.12"

[features]
default = ["glow"]
glow = ["dep:glow"]

[dependencies.glow]
version = "0.17"
optional = true

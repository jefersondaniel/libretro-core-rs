name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.2

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-docs-mdbook-${{ env.MDBOOK_VERSION }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', 'book/book.toml') }}
          restore-keys: |
            ${{ runner.os }}-docs-mdbook-${{ env.MDBOOK_VERSION }}-${{ steps.toolchain.outputs.cachekey }}-
            ${{ runner.os }}-docs-mdbook-${{ env.MDBOOK_VERSION }}-

      - name: Install mdBook
        run: |
          if ! command -v mdbook >/dev/null 2>&1; then
            cargo install mdbook --version "$MDBOOK_VERSION" --locked
          fi

      - name: Build Rustdoc
        run: cargo doc --workspace --no-deps

      - name: Build mdBook
        run: mdbook build book

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
